function loadQuestion(){

let q=questions[current];

document.getElementById("mission").innerHTML=
"Mission: "+q.mission;

document.getElementById("question").innerHTML=
q.question;

document.getElementById("feedback").innerHTML="";

let answers=document.getElementById("answers");
answers.innerHTML="";

q.answers.forEach((answer,index)=>{

let btn=document.createElement("button");

btn.className="answer";
btn.innerHTML=answer;

btn.onclick=()=>checkAnswer(index);

answers.appendChild(btn);

});

let percent=(current/questions.length)*100;

document.getElementById("progress").style.width=
percent+"%";
updateSystems();
}

function checkAnswer(choice){

let q=questions[current];

if(choice===q.correct){

score+=100;

document.getElementById("feedback").innerHTML=
"✅ Correct! System Repair Successful.";

}else{

document.getElementById("feedback").innerHTML=
"❌ Not quite. Review the science concept and try the next challenge.";
hull--;

updateHull();

if(hull <= 0){
    gameOver();
    return;
}
}

document.getElementById("score").innerHTML=
"Science Credits: "+score;

setTimeout(()=>{

current++;

if(current == 4 || current == 8 || current == 12 || current == 16 || current == 20 || current == 24 || current == 28 || current == 32 || current == 36 || current == 40){

showCaptainLog();
return;
}

if(current === 10){
   showMissionComplete("REACTOR CORE");
   return;
}

if(current === 20){
   showMissionComplete("THERMAL CONTROL");
   return;
}

if(current === 30){
   showMissionComplete("SUSTAINABILITY LAB");
   return;
}

if(current === 40){
   showMissionComplete("JUMP DRIVE");
   return;
}
 
return;
}else if(current >= questions.length){

    showEnding(); // Final log before ending
    return;

}else{

    loadQuestion();

}

},1200);

}

function updateHull(){

    let hearts = "";

    for(let i=0;i<hull;i++){
        hearts+="❤️ ";
    }

    document.getElementById("statusBar").innerHTML =
        "Hull Integrity: " + hearts;
}

function showCaptainLog(){

    if(currentLog >= captainLogs.length){
        loadQuestion();
        return;
    }

    document.getElementById("mission").innerHTML =
        "📁 CAPTAIN'S LOG UNLOCKED";

    document.getElementById("question").innerHTML =
        captainLogs[currentLog];

    document.getElementById("answers").innerHTML = "";
    document.getElementById("feedback").innerHTML = "";

    const btn = document.createElement("button");

    btn.className = "answer";
    btn.innerHTML = "Continue Mission";

    btn.onclick = () => {
        currentLog++;
        loadQuestion();
    };

    document
        .getElementById("answers")
        .appendChild(btn);
}

function showEnding(){

document.getElementById("progress").style.width="100%";

document.getElementById("mission").innerHTML=
"MISSION COMPLETE";

document.getElementById("question").innerHTML=
`
The Event Horizon has escaped the singularity.

Final Science Credits:
${score}

Ship Status:
✅ Reactor Online
✅ Thermal Control Online
✅ Sustainability Lab Online
✅ Jump Drive Online

Excellent work, Cadet.
`;

document.getElementById("answers").innerHTML=
`<button class="answer"
onclick="location.reload()">
Play Again
</button>`;

document.getElementById("feedback").innerHTML="";
}

function showMissionComplete(systemName){

    document.getElementById("mission").innerHTML =
        "SYSTEM RESTORED";

    document.getElementById("question").innerHTML =
        `
        ✅ ${systemName} ONLINE

        Repairs complete.

        New systems have been unlocked.
        `;

    document.getElementById("answers").innerHTML = "";

    const btn = document.createElement("button");

    btn.className="answer";

    btn.innerHTML="View Captain's Log";

    btn.onclick=()=>{
        showCaptainLog();
    };

    document.getElementById("answers")
        .appendChild(btn);
}
function gameOver(){

    document.getElementById("mission").innerHTML =
        "MISSION FAILED";

    document.getElementById("question").innerHTML =
        `
        Hull integrity has reached zero.

        The Event Horizon XII
        was consumed by the singularity.

        Science Credits:
        ${score}
        `;

    document.getElementById("answers").innerHTML =
        `
        <button class="answer"
        onclick="location.reload()">
            Restart Mission
        </button>
        `;

    document.getElementById("feedback").innerHTML="";
}
function updateSystems(){

    document.getElementById("systems")
    .innerHTML =

    (current>=5 ?
    "🟢 Reactor Core<br>"
    :
    "🔴 Reactor Core<br>")

    +

    (current>=10 ?
    "🟢 Thermal Control<br>"
    :
    "🔴 Thermal Control<br>")

    +

    (current>=15 ?
    "🟢 Sustainability Lab<br>"
    :
    "🔴 Sustainability Lab<br>")

    +

    (current>=20 ?
    "🟢 Jump Drive"
    :
    "🔴 Jump Drive");
}
